<div class="your-courses-page">
  <div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between mb-4">
      <div class="">
        <h2 class="page-title">المجموعات</h2>
        <p class="page-subtitle">إدارة ومتابعة المجموعات الدراسية</p>
      </div>
      <div class="">
        <button class="btn btn-primary-custom float-end m-2" type="button" (click)="loadGroup()">
          <i class="fas fa-rotate-right me-2"></i>
          تحديث
        </button>
        <button class="btn btn-primary-custom float-end m-2" type="button" (click)="openAddGroup()">
          <i class="fas fa-plus me-2"></i>
          إنشاء مجموعة جديدة
        </button>
        @if (isAddGroupOpen) {
          <app-add-group
            [courses]="courses"
            (closeModal)="closeGroupModal()"
            [groups]="selectedGroup"
          />
        }
      </div>
    </div>

    <div class="row g-4">
      @for (item of groups; track item.id) {
        <div class="col-12 col-md-6 col-lg-4">
          <article class="card group-card h-100">
            <div class="card-body d-flex flex-column">
              <div class="group-card__header">
                <div class="group-card__identity">
                  <div class="group-card__icon" aria-hidden="true">
                    <i class="fa-solid fa-users"></i>
                  </div>
                  <span class="group-card__badge">مجموعة دراسية</span>
                </div>
                <div class="dropdown">
                  <button
                    class="btn group-card__menu"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="خيارات المجموعة"
                  >
                    <i class="fas fa-ellipsis-v"></i>
                  </button>

                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item" type="button" (click)="editgroup(item)">
                        <i class="fas fa-edit me-2"></i>
                        تعديل
                      </button>
                    </li>

                    <li>
                      <button
                        class="dropdown-item text-danger"
                        type="button"
                        (click)="deleteGroup(item)"
                      >
                        <i class="fas fa-trash me-2"></i>
                        حذف
                      </button>
                    </li>
                  </ul>
                </div>
              </div>

              <h5 class="card-title group-card__title">{{ item.name }}</h5>

              <div class="group-card__details mt-auto">
                <div class="group-card__detail">
                  <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                  <div>
                    <span>المكان</span>
                    <strong>{{ item.location }}</strong>
                  </div>
                </div>
                <div class="group-card__detail">
                  <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                  <div>
                    <span>الأيام</span>
                    <strong>{{ item.schedule }}</strong>
                  </div>
                </div>
                <div class="group-card__detail">
                  <i class="fa-solid fa-clock" aria-hidden="true"></i>
                  <div>
                    <span>الساعة</span>
                    <strong>{{ item.time || 'غير محدد' }}</strong>
                  </div>
                </div>
                <div class="group-card__detail">
                  <i class="fa-solid fa-user-group" aria-hidden="true"></i>
                  <div>
                    <span>الحد الأقصى</span>
                    <strong>{{ item.maxStudents }} طالب</strong>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</div>
