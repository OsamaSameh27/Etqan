<div class="your-courses-page">
  <div class="container-fluid px-4">
    <div class="d-flex flex-wrap justify-content-between mb-4">
      <div class="">
        <h2 class="page-title">دوراتي</h2>
        <p class="page-subtitle">إدارة ومتابعة الدورات التي قمت بإنشائها</p>
      </div>
      <div class="">
        <button
          class="btn btn-danger-custom float-end m-2"
          type="button"
          [disabled]="courses.length === 0 || isDeletingAll"
          (click)="deleteAllCourses()"
        >
          @if (isDeletingAll) {
            <i class="fas fa-spinner fa-spin me-2"></i>
            جاري الحذف...
          } @else {
            <i class="fas fa-trash me-2"></i>
            حذف كل الدورات
          }
        </button>
        <button class="btn btn-primary-custom float-end m-2" type="button" (click)="loadCourses()">
          <i class="fas fa-rotate-right me-2"></i>
          تحديث
        </button>
        <button
          class="btn btn-primary-custom float-end m-2"
          type="button"
          (click)="openAddCourse()"
        >
          <i class="fas fa-plus me-2"></i>
          إنشاء دورة جديدة
        </button>
        @if (isAddCourseOpen) {
          <app-add-course
            [course]="selectedCourse"
            (closeModal)="closeCourseModal()"
          ></app-add-course>
        }
      </div>
    </div>

    <div class="row g-4">
      @for (item of courses; track item.id) {
        <div class="col-12 cards col-sm-6 col-xl-4 ">
          <article class="card course-card h-100">
            <div class="card-body d-flex flex-column">
              <div class="course-card__header">
                <div class="course-card__identity">
                  <div class="course-card__icon" aria-hidden="true">
                    <i class="fa-solid fa-book-open"></i>
                  </div>
                  <span class="course-card__subject">{{ item.subject }}</span>
                </div>
                <div class="dropdown">
                  <button
                    class="btn course-card__menu"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="خيارات الدورة"
                  >
                    <i class="fas fa-ellipsis-v"></i>
                  </button>

                  <ul class="dropdown-menu">
                    <li>
                      <button class="dropdown-item" (click)="editCourse(item)">
                        <i class="fas fa-edit me-2"></i>
                        تعديل
                      </button>
                    </li>

                    <li>
                      <button class="dropdown-item text-danger" (click)="deleteCourse(item)">
                        <i class="fas fa-trash me-2"></i>
                        حذف
                      </button>
                    </li>
                  </ul>
                </div>
              </div>

              <h5 class="card-title course-card__title">{{ item.title }}</h5>
              <p class="card-text text-muted course-card__description">{{ item.description }}</p>

              <div class="course-card__details mt-auto">
                <div class="course-card__detail">
                  <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                  <div>
                    <span>السنة الدراسية</span>
                    <strong>{{ item.grade }}</strong>
                  </div>
                </div>
                <div class="course-card__detail">
                  <i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i>
                  <div>
                    <span>السعر</span>
                    <strong>{{ item.price }} جنيه</strong>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</div>
