<div class="container hero-root" id="hero" dir="rtl">
  <div class="row align-items-center gy-5">
    <!-- Right Column (Text & Actions) -->
    <div
      class="col-lg-6 order-2 order-lg-1 text-center text-lg-start"
      data-aos="fade-right"
      data-aos-duration="1000"
    >
      <div class="hero-content">
        <!-- Badge -->
        <span
          class="hero-badge mb-3 d-inline-flex align-items-center gap-2 fw-bold rounded-pill px-3 py-1.5"
        >
          <span class="badge-dot"></span>
          منصة تعليمية متكاملة 🚀
        </span>
        <!-- Main Heading -->
        <h1 class="hero-title mb-3 fw-extrabold lh-base">
          كل ما يحتاجه <span class="text-gradient">الطالب والمدرس</span> في مكان واحد
        </h1>
        <!-- Description -->
        <p class="hero-desc mb-4 fs-5 mx-auto mx-lg-0">
          منصة <strong>إتقان</strong> تساعد المدرسين على إدارة الكورسات والامتحانات والمجموعات،
          وتمنح الطلاب تجربة تعليمية تفاعلية وسهلة.
        </p>
        <!-- Buttons -->
        <div
          class="d-flex flex-column flex-sm-row gap-3 mb-5 justify-content-center justify-content-sm-start"
        >
          <a class="btn btn-primary-custom hero-btn px-4 py-2.5 shadow-sm" routerLink="/register">
            <span>ابدأ الآن مجاناً</span>
            <i class="fa-solid fa-arrow-left ms-2"></i>
          </a>
          <a class="btn btn-outline-custom hero-btn px-4 py-2.5" href="#teachers">
            <span>تصفح المدرسين</span>
            <i class="fa-solid fa-graduation-cap ms-2"></i>
          </a>
        </div>
        <!-- Statistics Row -->
        <div class="hero-stats row g-3 mx-auto mx-lg-0" data-aos="fade-up" data-aos-delay="200">
          <div class="col-12 col-sm-4">
            <div class="stat-card py-3 px-2 text-center">
              <div class="stat-number fw-extrabold text-primary">+120</div>
              <div class="stat-label small text-muted mt-1">مدرس معتمد</div>
            </div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="stat-card py-3 px-2 text-center">
              <div class="stat-number fw-extrabold text-primary">+300</div>
              <div class="stat-label small text-muted mt-1">كورس تفاعلي</div>
            </div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="stat-card py-3 px-2 text-center">
              <div class="stat-number fw-extrabold text-primary">+5000</div>
              <div class="stat-label small text-muted mt-1">طالب نشط</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Left Column (Modern Illustration & Floating Icons) -->
    <div
      class="col-lg-6 order-1 order-lg-2 d-flex justify-content-center align-items-center"
      data-aos="fade-left"
      data-aos-duration="1000"
    >
      <div class="hero-visual position-relative">
        <!-- Main Illustration -->
        <img
          ngSrc="/hero2.webp"
          width="1200"
          height="800"
          priority
          alt="طالب يستخدم منصة إتقان التعليمية"
          class="student-svg img-fluid"
        />
        <!-- Floating Icons -->
        <div class="floating-icon icon-book" data-aos="zoom-in" data-aos-delay="300">
          <i class="fa-solid fa-book-open"></i>
        </div>

        <div class="floating-icon icon-laptop" data-aos="zoom-in" data-aos-delay="400">
          <i class="fa-solid fa-laptop"></i>
        </div>

        <div class="floating-icon icon-graduation" data-aos="zoom-in" data-aos-delay="500">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>

        <div class="floating-icon icon-pencil" data-aos="zoom-in" data-aos-delay="600">
          <i class="fa-solid fa-pencil"></i>
        </div>

        <div class="floating-icon icon-light" data-aos="zoom-in" data-aos-delay="700">
          <i class="fa-solid fa-lightbulb"></i>
        </div>

        <div class="floating-icon icon-certificate" data-aos="zoom-in" data-aos-delay="800">
          <i class="fa-solid fa-certificate"></i>
        </div>
      </div>
    </div>
  </div>
</div>
