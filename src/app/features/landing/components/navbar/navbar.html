<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">
    <!-- Logo: Always on the right (RTL) -->
    <a class="navbar-brand fw-bold fs-3 text-primary-brown me-lg-4" routerLink="/" fragment="hero">
      <img src="/logo.png" alt="إتقان" />
    </a>

    <!-- Desktop nav: center, mobile: hidden unless collapsed -->
    <button
      class="navbar-toggler border-0 shadow-none ms-1"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNavDropdown"
      aria-controls="navbarNavDropdown"
      aria-expanded="false"
      aria-label="تبديل القائمة"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Centered nav & buttons: use flex utility classes -->
    <div
      class="collapse navbar-collapse flex-lg-row-reverse text-center text-lg-start"
      id="navbarNavDropdown"
    >
      <!-- Nav Pages (centered in desktop by margin auto, full width in mobile) -->
      <ul class="navbar-nav mx-auto mx-lg-auto mb-2 mb-lg-0 gap-lg-3 gap-2 align-items-lg-center">
        <li class="nav-item">
          <a
            class="nav-link px-2"
            routerLink="/"
            fragment="hero"
            [class.active]="activeSection() === 'hero'"
            [attr.aria-current]="activeSection() === 'hero' ? 'page' : null"
            (click)="selectSection('hero')"
            >الرئيسية</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            routerLink="/"
            fragment="courses"
            [class.active]="activeSection() === 'courses'"
            [attr.aria-current]="activeSection() === 'courses' ? 'page' : null"
            (click)="selectSection('courses')"
            >الكورسات</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            routerLink="/"
            fragment="how-it-works"
            [class.active]="activeSection() === 'how-it-works'"
            [attr.aria-current]="activeSection() === 'how-it-works' ? 'page' : null"
            (click)="selectSection('how-it-works')"
            >كيف تشترك؟</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            routerLink="/"
            fragment="teachers"
            [class.active]="activeSection() === 'teachers'"
            [attr.aria-current]="activeSection() === 'teachers' ? 'page' : null"
            (click)="selectSection('teachers')"
            >المدرسون</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            routerLink="/"
            fragment="faq"
            [class.active]="activeSection() === 'faq'"
            [attr.aria-current]="activeSection() === 'faq' ? 'page' : null"
            (click)="selectSection('faq')"
            >الأسئلة الشائعة</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link px-2"
            routerLink="/"
            fragment="contact"
            [class.active]="activeSection() === 'contact'"
            [attr.aria-current]="activeSection() === 'contact' ? 'page' : null"
            (click)="selectSection('contact')"
            >تواصل معنا</a
          >
        </li>
      </ul>

      <!-- Auth Buttons (left on desktop, stacked below on mobile) -->
      @if (!user()) {
        <div
          class="d-flex flex-column flex-lg-row gap-2 mx-auto mx-lg-3 mt-3 mt-lg-0 align-items-center"
        >
          <div class="buttons d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">
            <a class="btn btn-login" routerLink="/login"> تسجيل الدخول </a>

            <a class="btn btn-register" routerLink="/register"> إنشاء حساب </a>
          </div>
        </div>
      } @else {
        <div
          class="d-flex flex-column flex-lg-row gap-2 mx-auto mx-lg-3 mt-3 mt-lg-0 align-items-center"
        >
          <div class="buttons d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">
            <a
              class="btn btn-register"
              [routerLink]="
                user()?.role === 'teacher' ? '/dashboard/teacher' : '/dashboard/student'
              "
            >
              لوحة التحكم
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</nav>
<!-- Scoped styles for this component -->
